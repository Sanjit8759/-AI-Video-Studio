name: Build AI ANCHOR SANJIT V14

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | bash "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          bash "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p source
          unzip -q AI_ANCHOR_SANJIT_v14_fixed.zip -d source

      - name: Find Android project
        shell: bash
        run: |
          PROJECT_FILE=$(find source -type f -name settings.gradle.kts | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found in ZIP"
            find source -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      - name: Add anchor video
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/assets/videos"

          cp VID-20261105-WA0039.mp4 \
            "$PROJECT_DIR/app/src/main/assets/videos/standing_anchor.mp4"

          test -f "$PROJECT_DIR/app/src/main/assets/videos/standing_anchor.mp4"

          echo "Anchor video added successfully"

      - name: Check project files
        shell: bash
        run: |
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "All required files found"

      - name: Build APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug

          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "$GITHUB_WORKSPACE/ES-NEWS-ANCHOR-V14.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ES-NEWS-ANCHOR-V14
          path: ES-NEWS-ANCHOR-V14.apk
          if-no-files-found: error
