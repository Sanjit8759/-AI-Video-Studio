name: Build AI ANCHOR SANJIT v14

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir source
          unzip -q AI_ANCHOR_SANJIT_v14_project.zip -d source

      - name: Add anchor video
        run: |
          mkdir -p source/AI_ANCHOR_SANJIT_v14/app/src/main/assets/videos
          cp VID-20261105-WA0039.mp4 source/AI_ANCHOR_SANJIT_v14/app/src/main/assets/videos/standing_anchor.mp4

      - name: Build APK
        run: |
          gradle -p source/AI_ANCHOR_SANJIT_v14 :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-ANCHOR-SANJIT-v14
          path: source/AI_ANCHOR_SANJIT_v14/app/build/outputs/apk/debug/app-debug.apk
