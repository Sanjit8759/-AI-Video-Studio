
name: Build AI ANCHOR SANJIT v14.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | bash "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          bash "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q AI_ANCHOR_SANJIT_v14_fixed.zip -d source

      - name: Add standing anchor video
        run: |
          mkdir -p source/app/src/main/assets/videos
          cp VID-20261105-WA0039.mp4 source/app/src/main/assets/videos/standing_anchor.mp4
          ls -lh source/app/src/main/assets/videos/

      - name: Check project files
        run: |
          test -f source/settings.gradle.kts
          test -f source/build.gradle.kts
          test -f source/app/build.gradle.kts
          test -f source/app/src/main/AndroidManifest.xml
          test -f source/app/src/main/java/com/aianchorsanjit/app/MainActivity.kt
          test -f source/app/src/main/assets/videos/standing_anchor.mp4
          echo "All required files found"

      - name: Build APK
        run: |
          gradle -p source :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-ANCHOR-SANJIT-v14.1
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
