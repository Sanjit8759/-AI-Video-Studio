
name: Build ES NEWS v13.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | bash "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          bash "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract v13.2 project
        run: |
          mkdir source
          unzip -q ES_News_Talking_Anchor_v13_2_GitHub_Avatar.zip -d source

      - name: Check Android project files
        run: |
          test -f source/settings.gradle.kts
          test -f source/build.gradle.kts
          test -f source/app/build.gradle.kts
          echo "Android project files found"

      - name: Build APK
        run: |
          gradle -p source :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ES-NEWS-v13.2-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
