
name: Build ES NEWS v13.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Extract v13.2 project
        run: |
          mkdir source
          unzip -q ES_News_Talking_Anchor_v13_2_GitHub_Avatar.zip -d source

      - name: Build APK
        run: |
          chmod +x source/gradlew
          ./source/gradlew -p source :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ES-NEWS-v13.2-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
