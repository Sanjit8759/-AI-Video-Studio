
name: Build ES NEWS v13.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Extract v13.2 project
        run: |
          mkdir source
          unzip -q ES_News_Talking_Anchor_v13_2_GitHub_Avatar.zip -d source

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find source -name gradlew -type f -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ES-NEWS-v13.2-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
