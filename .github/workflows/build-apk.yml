
name: Build ES News Talking Anchor v8 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract v8 project
        run: |
          mkdir source
          unzip -q ES_News_Talking_Anchor_v8.zip -d source

      - name: Build APK
        run: |
          gradle --no-daemon -p source :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ES-News-Talking-Anchor-v8-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
